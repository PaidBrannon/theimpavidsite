<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Review moderation | The Impavid</title><style>body{font:16px/1.5 system-ui;background:#f3f5f8;color:#122038;max-width:820px;margin:36px auto;padding:0 20px}article{background:white;border:1px solid #dce1ea;border-radius:12px;padding:20px;margin:16px 0}button,input{font:inherit;padding:10px;border-radius:8px}input{width:min(100%,550px);box-sizing:border-box}button{background:#122038;color:white;border:0;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.5}small{color:#56647a}p{overflow-wrap:anywhere;white-space:pre-wrap}</style></head><body><h1>Book review moderation</h1><p>Private owner tool. Enter your review administration secret to see pending reviews. The secret stays in this browser tab's memory and is not saved.</p><label for="token">Review administration secret</label><div><input id="token" type="password" autocomplete="off" placeholder="REVIEW_ADMIN_SECRET"><button id="load">Load pending reviews</button></div><p id="status" role="status"></p><div id="items"></div><script>
const token=document.getElementById('token'),items=document.getElementById('items'),status=document.getElementById('status');
const titles={rg:'Relationship Goals',wws:'Watch Where You’re Standing',mom:'Mind Over Mirror'};
async function call(method,body){const r=await fetch('/api/reviews-admin',{method,headers:{Authorization:'Bearer '+token.value,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function node(tag,txt){const e=document.createElement(tag);e.textContent=txt;return e}
async function load(){status.textContent='Loading…';items.replaceChildren();try{const d=await call('GET');status.textContent=d.reviews.length+' pending review(s)';for(const r of d.reviews){const a=node('article','');a.append(node('h2',titles[r.book]||r.book),node('strong',r.name+' · '+'★'.repeat(r.rating)),node('p',r.text),node('small',new Date(r.createdAt).toLocaleString()));for(const action of ['approve','reject']){const b=node('button',action==='approve'?'Approve & publish':'Reject');b.onclick=async()=>{if(!confirm((action==='approve'?'Publish':'Reject')+' this review?'))return;b.disabled=true;try{await call('POST',{id:r.id,action});await load()}catch(e){status.textContent=e.message;b.disabled=false}};a.append(b)}items.append(a)}}catch(e){status.textContent=e.message}}
document.getElementById('load').onclick=load;
</script></body></html>
