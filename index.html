<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Impavid – Website Prototype</title>
<meta name="description" content="Interactive prototype of The Impavid: financial wellness, health and fitness, personal development.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#0d1b2e;--mut:#55627a;--line:#d9dfea;--fin:#1f4fd8;--fit:#d9480f;--mind:#0b7a6b;--gold:#f2a900;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--card:#121d31;--ink:#eef2f9;--mut:#a3afc4;--line:#25324a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Sora,system-ui,sans-serif}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.02em}h1{font-size:clamp(2rem,5.5vw,3.6rem);font-weight:800}h2{font-size:clamp(1.5rem,3vw,2.1rem)}h3{font-size:1.15rem}
p{margin:0 0 1em;max-width:68ch}a{color:inherit}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
.banner{background:var(--gold);color:#1a1200;font-size:.82rem;text-align:center;padding:6px 12px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:14px;height:64px}
.logo{font-weight:800;letter-spacing:.14em;text-decoration:none;display:flex;gap:8px;align-items:center}
nav{display:flex;gap:4px;margin-left:auto;align-items:center}
nav a{padding:8px 10px;border-radius:8px;text-decoration:none;font-size:.9rem}nav a:hover,nav a.on{background:var(--bg)}
nav a.cta{background:var(--ink);color:var(--bg)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);font:inherit}
.cartb{position:relative}.cartb b{background:var(--gold);color:#1a1200;border-radius:99px;font-size:.7rem;padding:1px 6px;margin-left:4px}
@media(max-width:860px){.burger{display:block}nav{display:none;position:absolute;left:0;right:0;top:64px;background:var(--card);flex-direction:column;align-items:stretch;padding:10px 20px;border-bottom:1px solid var(--line)}nav.open{display:flex}}
.hero{background:linear-gradient(135deg,#0d1b2e,#16305c);color:#fff;padding:72px 0 80px}
.hero p{color:#c9d4e8;font-size:1.1rem}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 20px;font:600 .95rem Sora,sans-serif;cursor:pointer;text-decoration:none;background:var(--ink);color:var(--bg);margin:0 8px 8px 0}
.btn.gold{background:var(--gold);color:#1a1200}.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
section{padding:56px 0}.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;position:relative}
.card.link{text-decoration:none;display:block;transition:transform .2s,box-shadow .2s}.card.link:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(13,27,46,.15)}
.tag{font-size:.78rem;font-weight:600;color:var(--c,var(--mut))}
.bar{height:5px;border-radius:5px;background:var(--c);margin-bottom:16px;width:48px}
.fin{--c:var(--fin)}.fit{--c:var(--fit)}.mind{--c:var(--mind)}
.tool{border:2px solid var(--c);border-radius:18px;padding:26px;background:var(--card)}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
.err{color:#c0262d;font-size:.88rem;min-height:1.3em;margin:6px 0}
.res{margin-top:20px;padding:20px;border-radius:14px;background:var(--bg);border-left:6px solid var(--c)}
.big{font-size:2.6rem;font-weight:800;color:var(--c);line-height:1}
.note{font-size:.84rem;color:var(--mut)}
.conv{background:var(--ink);color:var(--bg);border-radius:16px;padding:28px;margin-top:20px}.conv p{opacity:.85}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.opt:hover{border-color:var(--mind)}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 18px}.prog i{display:block;height:100%;background:var(--mind);transition:width .3s}
.cover{aspect-ratio:2/3;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;font-weight:800;background:linear-gradient(160deg,var(--c),#0d1b2e);position:relative;max-width:190px}
.cover small{font-weight:400;opacity:.85;font-size:.68rem}.cover:before{content:"COMING SOON";position:absolute;top:8px;left:8px;font-size:.55rem;opacity:.8}
img.cv{width:190px;max-width:100%;height:auto;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25)}.book{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.price{font-size:1.4rem;font-weight:800}
table{width:100%;border-collapse:collapse}td,th{padding:12px 6px;border-bottom:1px solid var(--line);text-align:left}
.qty{width:60px}.slots{display:flex;flex-wrap:wrap;gap:8px}.slot{padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.slot.on{background:var(--ink);color:var(--bg)}
.ok{background:#e3f6ec;color:#0b4a2b;padding:16px;border-radius:12px;margin-top:14px}
footer{background:var(--card);border-top:1px solid var(--line);padding:30px 0;font-size:.85rem;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="wrap nav"><a class="logo" href="#home"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M13 3a10 10 0 0 1 8.7 5"/><path d="M22 18a10 10 0 0 1-9 5"/><path d="M4 18a10 10 0 0 1 0-9"/><path d="M19 4l3 4-5 1M18 22l-4 1 1-5M4 9l3-4 1 5" stroke-width="1.6"/></svg>THE IMPAVID</a>

<footer><div class="wrap">© The Impavid · support@theimpavid.com · Privacy: the free tools run in your browser and send nothing to a server. · The Impavid provides education, not financial, medical or mental-health advice.</div></footer>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const BOOKS={
 rg:{t:'Relationship Goals',sub:'A Modern Guide To Getting More Out Of Your Bank',cat:'Financial Wellness',c:'fin',fmt:'EPUB e-book (instant download)',price:4.99,img:'assets/relationship-goals.jpg',d:'A modern guide to understanding banking relationships and financial opportunities. Also available on Kindle at $8.99 (free with Kindle Unlimited).'},
 wws:{t:'Watch Where You’re Standing',sub:'The Three Circles Method',cat:'Personal Development',c:'mind',fmt:'EPUB e-book (instant download)',price:4.99,img:'assets/watch-where-youre-standing.jpg',d:'A personal development book on emotional awareness, perspective and the Three Circles Method.'},
 mom:{t:'Mind Over Mirror',sub:'Fitness, nutrition and the mindset behind transformation',cat:'Health & Fitness',c:'fit',fmt:'E-book',price:null,soon:1,d:'A body-transformation book on fitness, nutrition, discipline and mindset. Coming soon.'}};
const SVC={fin:{n:'Financial Wellness Consultation',c:'fin'},mind:{n:'Personal Development Consultation',c:'mind'},fit:{n:'Fitness & Wellness Consultation',c:'fit'}};
let cart={},bk={svc:'fin',pkg:null,name:'',email:'',phone:'',err:'',busy:false},quiz={i:0,a:[]};
const money=n=>'$'+n.toFixed(2),cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function cover(k){const b=BOOKS[k];if(b.img)return `<img class="cv" src="${b.img}" alt="Cover of ${b.t}" width="190" loading="lazy">`;return `<div class="cover ${b.c}" role="img" aria-label="Placeholder cover for ${b.t}">${b.t}<small>${b.sub.split(':')[0]}</small></div>`}
function bookCard(k){const b=BOOKS[k];return `<div class="card ${b.c} book">${cover(k)}<div style="flex:1;min-width:200px"><span class="tag">Featured book · ${b.cat}</span><h3>${b.t}</h3><p>${b.d}</p><div class="price">${b.price?money(b.price):'Coming soon'}</div><p class="note">${b.fmt}</p>${buy(k)}<a class="btn ghost" href="#product-${k}">Learn more</a></div></div>`}
const buy=k=>BOOKS[k].soon?'<button class="btn" disabled>Coming soon</button>':`<button class="btn" onclick="add('${k}')">Add to cart</button>`;
function add(k){if(BOOKS[k].soon)return;if(cart[k])return toast('Already in your cart');cart[k]=1;navUpdate();toast(BOOKS[k].t+' added to cart')}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0d1b2e;color:#fff;padding:10px 18px;border-radius:10px;z-index:50;font-size:.9rem';document.body.append(t)}t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',1800)}
function toggleNav(){const n=$('#nav'),o=n.classList.toggle('open');$('.burger').setAttribute('aria-expanded',o)}
function navUpdate(){const r=location.hash.slice(1)||'home',L=[['home','Home'],['financial','Financial Wellness'],['fitness','Health & Fitness'],['growth','Personal Development'],['store','Bookstore'],['about','About']];
 $('#nav').innerHTML=L.map(([h,t])=>`<a href="#${h}" class="${r===h?'on':''}">${t}</a>`).join('')+`<a class="cta" href="#booking">Book a Consultation</a><a class="cartb" href="#cart" aria-label="Cart, ${cnt()} items">🛒<b>${cnt()}</b></a>`;$('#nav').classList.remove('open')}
function next(items){return `<section><div class="wrap"><h2>Continue your journey</h2><div class="grid">${items.map(([h,t,d,c])=>`<a class="card link ${c}" href="#${h}"><div class="bar"></div><h3>${t}</h3><p class="note">${d}</p></a>`).join('')}</div></div></section>`}
const ALL=[['financial','Financial Wellness','Credit score tool and banking education.','fin'],['fitness','Health & Fitness','BMI calculator and fitness services.','fit'],['growth','Personal Development','Mindset quiz and the Three Circles Method.','mind'],['store','Bookstore','Books from The Impavid.','fin']];
function toolCard(id,c,t,d,h){return `<div class="card ${c}"><div class="bar"></div><h3>${t}</h3><p>${d}</p><a class="btn" href="#${h}">Try it free</a></div>`}
function conv(c,h,p,b1,svc,b2,l2){return `<div class="conv ${c}"><h3>${h}</h3><p>${p}</p><a class="btn gold" href="#booking" onclick="bk.svc='${svc}'">${b1}</a><a class="btn ghost" href="#${l2}">${b2}</a></div>`}
function hero(c,t,p){return `<div class="hero ${c}" style="background:linear-gradient(135deg,#0d1b2e,var(--c))"><div class="wrap"><h1>${t}</h1><p>${p}</p></div></div>`}
/* ---- pages ---- */
const P={
home:()=>`<div class="hero"><div class="wrap"><h1>Improve your mind. Strengthen your body. Build your future.</h1><p>The Impavid provides the knowledge, resources, and guidance to help you take control of your financial wellness, physical health, and personal development.</p><a class="btn gold" href="#growth">Explore our services</a><a class="btn ghost" href="#booking">Book a consultation</a></div></div>
<section><div class="wrap"><div class="grid">
<a class="card link fin" href="#financial"><div class="bar"></div><span class="tag">Build your wealth</span><h3>Financial Wellness</h3><p class="note">Credit, banking and financial literacy.</p></a>
<a class="card link mind" href="#growth"><div class="bar"></div><span class="tag">Strengthen your mind</span><h3>Personal Development</h3><p class="note">Mindset, awareness and goals.</p></a>
<a class="card link fit" href="#fitness"><div class="bar"></div><span class="tag">Improve your health</span><h3>Health & Fitness</h3><p class="note">Training, nutrition and wellness.</p></a></div></div></section>
<section style="padding-top:0"><div class="wrap"><h2>Discover your starting point</h2><p>Every journey begins with understanding where you stand.</p><div class="grid">
${toolCard(0,'fin','What can your credit score do for you?','Enter a score you already know and see what it may open up.','financial')}
${toolCard(0,'fit','Try our free BMI calculator','A quick adult screening measure with a reference weight range.','fitness')}
${toolCard(0,'mind','What’s your mindset?','Seven questions to reflect on how you respond to life.','growth')}</div></div></section>`+next([['store','Explore more from The Impavid','Browse the bookstore.','fin'],['booking','Book a consultation','Choose a service and time.','mind']]),
financial:()=>hero('fin','Financial Wellness','Financial literacy, credit profiles and banking relationships.')+`<section><div class="wrap"><div class="tool fin"><h2>What can your credit score do for you?</h2><p class="note">Not a credit check. Enter a score you already know. We never ask for your SSN, reports or account logins.</p><label for="cs">Your credit score (300–850)</label><input id="cs" type="number" inputmode="numeric" min="300" max="850"><div class="err" id="cse" role="alert"></div><button class="btn" onclick="credit()">See my opportunities</button><div id="cso"></div></div>${bookCard('rg')}</div></section>`,
fitness:()=>hero('fit','Health & Fitness','Fitness education, nutrition, training and transformation programs.')+`<section><div class="wrap"><div class="tool fit"><h2>Try our free BMI calculator</h2><p class="note">For adults 18+. BMI is a screening measure; it does not directly measure body fat, muscle or overall health.</p><label for="u">Units</label><select id="u" onchange="bmiU()"><option value="i">Feet/inches &amp; pounds</option><option value="m">Centimeters &amp; kilograms</option></select><div class="row" id="hrow"></div><label for="w" id="wl">Weight (lb)</label><input id="w" type="number" inputmode="decimal" min="0"><div class="err" id="be" role="alert"></div><button class="btn" onclick="bmi()">Calculate</button><div id="bo"></div></div>${bookCard('mom')}</div></section>`,
growth:()=>hero('mind','Personal Development','Explore your mindset, emotional awareness and goals.')+`<section><div class="wrap"><div class="tool mind" id="qz"></div><div class="card mind" style="margin:20px 0"><h3>The Three Circles Method</h3><p>People feel several emotions at once. Inspired by <i>Watch Where You’re Standing</i>, the idea is to notice where your attention goes, recognize your emotional patterns, and choose how to respond. It builds self-awareness; it does not diagnose anything.</p></div>${bookCard('wws')}</div></section>`,
store:()=>hero('fin','Bookstore','Books from The Impavid.')+`<section><div class="wrap"><div class="grid">${Object.keys(BOOKS).map(k=>{const b=BOOKS[k];return `<div class="card ${b.c}">${cover(k)}<span class="tag" style="display:block;margin-top:12px">${b.cat}</span><h3>${b.t}</h3><div class="price">${b.price?money(b.price):'Coming soon'}</div><a class="btn ghost" href="#product-${k}">Details</a>${buy(k)}</div>`}).join('')}</div></div></section>`,
about:()=>hero('fin','About The Impavid','An independent company, built around growth.')+`<section><div class="wrap"><h2>Our mission</h2><p>To empower individuals with the knowledge, resources, and guidance to improve their financial well-being, strengthen their physical and mental wellness, and achieve meaningful personal growth.</p><div class="grid"><div class="card fin"><h3>Philosophy</h3><p class="note">Education first, tools you can use today, no fear or pressure.</p></div><div class="card mind"><h3>Services</h3><p class="note">Consultations, coaching, fitness and wellness services.</p></div><div class="card fit"><h3>Resources</h3><p class="note">Books, articles and digital products.</p></div></div><h3 style="margin-top:28px">Founder</h3><p class="note">Placeholder: short founder bio (Austin Brannon) goes here, kept secondary to the company.</p></div></section>`,
booking:()=>{const s=SVC[bk.svc],C=CATS[bk.svc],ac={name:'name',email:'email',phone:'tel'},f=(id,l,t)=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(bk[id])}" oninput="bk.${id}=this.value" autocomplete="${ac[id]}">`;
 return hero(s.c,'Book a consultation','Pay securely first. We will then contact you to arrange your date and time.')+`<section><div class="wrap"><div class="card ${s.c}"><label for="sv">1. Choose a category</label><select id="sv" onchange="bk.svc=this.value;route()">${Object.keys(CATS).map(k=>`<option value="${k}" ${k===bk.svc?'selected':''}>${CATS[k][1]}</option>`).join('')}</select><p class="note" style="margin-top:8px">${C[2]}</p><label>2. Choose a package</label><div class="grid">${Object.keys(PKG).map(k=>`<button class="opt" aria-pressed="${bk.pkg===k}" style="${bk.pkg===k?'border:3px solid var(--ink)':''}" onclick="bk.pkg='${k}';route()"><b>${PKG[k][0]}</b><br>$${PKG[k][1]} · ${PKG[k][2]} minutes</button>`).join('')}</div>${f('name','3. Full name','text')}${f('email','Email address','email')}${f('phone','Phone number','tel')}<div class="err" role="alert">${esc(bk.err)}</div><button class="btn" ${bk.busy?'disabled':''} onclick="payConsult()">${bk.busy?'Opening Stripe…':'Continue to secure payment'}</button><p class="note">No date or time is chosen here. After payment we contact you within 24–48 hours to arrange your consultation. Your details are used only for that purpose.</p></div></div></section>`},
cart:()=>{const ks=Object.keys(cart);let tot=ks.reduce((a,k)=>a+(BOOKS[k].price||0)*cart[k],0);
 return hero('fin','Your cart','Review your order.')+`<section><div class="wrap">${ks.length?`<table><tr><th>Item</th><th>Price</th><th></th></tr>${ks.map(k=>`<tr><td>${BOOKS[k].t}<br><span class="note">${BOOKS[k].fmt}</span></td><td>${BOOKS[k].price?money(BOOKS[k].price):'TBD'}</td><td><button class="slot" onclick="delete cart['${k}'];route()">Remove</button></td></tr>`).join('')}</table><p class="price" style="margin-top:16px">Subtotal: ${money(tot)}</p><button class="btn" onclick="payBooks()">Checkout with Stripe</button><div class="err" id="ce" role="alert"></div><p class="note">Secure payment by Stripe. Your EPUB download appears right after payment.</p>`:`<p>Your cart is empty. <a href="#store">Browse the bookstore</a>.</p>`}</div></section>`}
};
function product(k){const b=BOOKS[k];return hero(b.c,b.t,b.sub)+`<section><div class="wrap"><div class="book">${cover(k)}<div style="flex:1;min-width:220px" class="${b.c}"><span class="tag">${b.cat}</span><p>${b.d}</p><p class="note">Format: ${b.fmt}</p><div class="price">${b.price?money(b.price):'Coming soon'}</div>${buy(k)}</div></div></div></section>`+next(Object.keys(BOOKS).filter(x=>x!==k).map(x=>['product-'+x,BOOKS[x].t,BOOKS[x].cat,BOOKS[x].c]))}
const esc=x=>String(x||'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const CATS={fin:['financial-wellness','Financial Wellness','Financial literacy, credit education, banking relationships and financial strategies.'],fit:['health-fitness','Health & Fitness','Fitness coaching, wellness habits, mindset development and personal well-being.'],mind:['personal-development','Personal Development','Life coaching, personal growth, goal setting, mindset and motivation.']};
const PKG={essential:['Essential',50,30],extended:['Extended',99,60],premium:['Premium',199,90]};
P.success=()=>hero('fin','Thank you','Confirming your payment…')+'<section><div class="wrap" id="ok" aria-live="polite">Checking your payment…</div></section>';
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong. Please try again.');return j}
async function payConsult(){const e=m=>{bk.err=m;route()};if(!bk.pkg)return e('Choose a package.');if(bk.name.trim().length<2)return e('Enter your full name.');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(bk.email.trim()))return e('Enter a valid email address.');if(!/^[0-9+()\-.\s]{7,25}$/.test(bk.phone.trim()))return e('Enter a valid phone number.');bk.err='';bk.busy=true;route();
 try{const j=await post('/api/checkout-consultation',{category:CATS[bk.svc][0],package:bk.pkg,name:bk.name.trim(),email:bk.email.trim(),phone:bk.phone.trim()});location.href=j.url}catch(x){bk.busy=false;e(x.message)}}
async function payBooks(){const el=$('#ce');try{const j=await post('/api/checkout-books',{items:Object.keys(cart)});location.href=j.url}catch(x){el.textContent=x.message}}
async function loadOrder(){const el=$('#ok'),sid=new URLSearchParams(location.search).get('session_id');if(!el)return;if(!sid){el.textContent='No order found. If you just paid, contact support@theimpavid.com.';return}
 try{const j=await (await fetch('/api/order?session_id='+encodeURIComponent(sid))).json();if(!j.paid){el.innerHTML='<p>Your payment is not confirmed yet. Reload in a moment, or contact support@theimpavid.com.</p>';return}
 el.innerHTML=j.kind==='consultation'?`<h2>Payment received</h2><p>Thank you for booking with The Impavid! Your payment has been received. We will contact you within 24–48 hours to personally arrange your consultation.</p><p class="note">${esc(j.category)} · ${esc(j.package)}</p>`:`<h2>Your books</h2>${j.downloads.map(d=>`<a class="btn" href="${esc(d.url)}">Download ${esc(d.title)} (EPUB)</a>`).join('<br>')}<p class="note">Download links expire after 15 minutes. Reload this page for fresh links.</p>`}catch{el.textContent='We could not confirm your order. Please contact support@theimpavid.com.'}}
/* ---- tools ---- */
function credit(){const v=$('#cs').value,n=+v,e=$('#cse');if(!v||!Number.isInteger(n)||n<300||n>850){e.textContent='Enter a whole number from 300 to 850.';$('#cso').innerHTML='';return}e.textContent='';
 const R=[[579,'Poor','Approval is difficult and costs are typically higher.','Secured cards, credit-builder loans; some subprime auto loans.','Limited options; higher interest likely.','Pay on time, lower balances, dispute errors, avoid new applications.'],[669,'Fair','Some options exist, usually at higher cost.','Credit cards, auto loans, some personal loans; FHA-type mortgages.','Higher rates than top tiers.','Cut utilization below 30%, keep accounts current.'],[739,'Good','Near or above average; many options.','Most cards, auto, personal and mortgage loans.','Best offers may still be out of reach.','Keep utilization low and history long.'],[799,'Very Good','Lenders generally view this favorably.','Wide range including competitive mortgage and business financing.','Little; minor rate differences.','Maintain habits; compare offers.'],[850,'Exceptional','Top tier among borrowers.','Broadest access, often the most favorable terms.','Score alone does not guarantee approval.','Maintain habits and review reports yearly.']];
 const r=R.find(x=>n<=x[0]);$('#cso').innerHTML=`<div class="res"><div class="big">${n} · ${r[1]}</div><p>${r[2]}</p><p><b>Financing that may be accessible:</b> ${r[3]}</p><p><b>Potential challenges:</b> ${r[4]}</p><p><b>Opportunities:</b> ${r[5]}</p><p class="note">Approval and rates depend on income, debt, credit history, lender rules and the scoring model. Nothing here guarantees approval or a rate.</p></div>`+conv('fin','Your credit score is only part of your financial profile.','Discover how to strengthen your financial position and make more informed financial decisions.','Book a credit consultation','fin','Explore financial resources','store')}
function bmiU(){const m=$('#u').value==='m';$('#hrow').innerHTML=m?'<div><label for="h1">Height (cm)</label><input id="h1" type="number" min="0"></div>':'<div><label for="h1">Feet</label><input id="h1" type="number" min="0"></div><div><label for="h2">Inches</label><input id="h2" type="number" min="0"></div>';$('#wl').textContent=m?'Weight (kg)':'Weight (lb)'}
function bmi(){const m=$('#u').value==='m',w=+$('#w').value,h1=+$('#h1').value,h2=+($('#h2')?.value||0),e=$('#be');
 const hm=m?h1/100:(h1*12+h2)*.0254,kg=m?w:w*.45359237;
 if(!(hm>.9&&hm<2.5)||!(kg>20&&kg<400)){e.textContent='Enter a realistic adult height and weight.';$('#bo').innerHTML='';return}e.textContent='';
 const b=kg/hm/hm,c=b<18.5?'Underweight':b<25?'Healthy weight':b<30?'Overweight':'Obesity',lo=18.5*hm*hm,hi=24.9*hm*hm,f=x=>m?x.toFixed(1)+' kg':Math.round(x/.45359237)+' lb';
 $('#bo').innerHTML=`<div class="res"><div class="big">${b.toFixed(1)}</div><p><b>${c}</b> (adult reference categories)</p><p>BMI compares weight to height. Reference range for your height: ${f(lo)} to ${f(hi)}. It does not measure body fat, muscle or overall health.</p><p>Healthy habits to explore: regular movement, balanced meals, sleep, and consistency.</p></div><div class="conv fit"><h3>Understanding where you are is the first step toward where you want to be.</h3><p>Personal training, fitness consultations, body-transformation coaching, nutrition education and programs.</p><a class="btn gold" href="#booking" onclick="bk.svc='fit'">Book a fitness consultation</a><a class="btn ghost" href="#store">Explore fitness services</a></div>`}
const Q=[['When a challenge shows up, you…',['Run through every outcome first','Look for the bright side','Assess the facts','Start building a plan']],['After a setback, you…',['Replay what went wrong','Believe it will turn around','Accept it and adjust','Fix the cause right away']],['Your general outlook is…',['Cautious','Hopeful','Balanced','Action-oriented']],['Facing a problem, you…',['Gather more info before moving','Trust it will work out','Weigh pros and cons','Break it into steps']],['When emotions run high, you…',['Dwell on them','Stay upbeat','Name them calmly','Channel them into tasks']],['With uncertainty, you…',['Worry about what-ifs','Expect good things','Plan for likely cases','Create a process']],['For personal growth, you…',['Reflect deeply','Stay motivated','Set realistic goals','Track and improve']]];
const PR=[{n:'The Overthinker',d:'You think things through carefully and notice details others miss.',s:'Thoroughness, foresight, empathy.',c:'Getting stuck in loops or delaying decisions.',q:'Which thoughts are about facts, and which are guesses?',t:'Set a decision deadline; write worries down, then pick one next action.'},{n:'The Optimist',d:'You lean toward hope and energy.',s:'Resilience, motivation, positivity.',c:'Overlooking risks or avoiding hard feelings.',q:'What risk am I not looking at yet?',t:'Pair optimism with a simple backup plan.'},{n:'The Realist',d:'You weigh evidence and stay grounded.',s:'Balance, clarity, steadiness.',c:'Under-valuing possibility.',q:'What would be worth trying even without proof?',t:'Schedule one experiment a month.'},{n:'The Problem Solver',d:'You turn challenges into steps.',s:'Initiative, structure, momentum.',c:'Rushing past feelings.',q:'What am I feeling before I act?',t:'Pause to name the emotion, then solve.'}];
function qz(){const el=$('#qz');if(!el)return;
 if(quiz.i<Q.length){const[q,o]=Q[quiz.i];el.innerHTML=`<h2>What’s your mindset?</h2><p class="note">A reflection exercise, not a clinical assessment or permanent label.</p><div class="note">Question ${quiz.i+1} of ${Q.length}</div><div class="prog"><i style="width:${quiz.i/Q.length*100}%"></i></div><h3>${q}</h3>${o.map((x,i)=>`<button class="opt" onclick="quiz.a.push(${i});quiz.i++;qz()">${x}</button>`).join('')}`;return}
 const t=[0,0,0,0];quiz.a.forEach(i=>t[i]++);const k=t.indexOf(Math.max(...t)),p=PR[k];
 el.innerHTML=`<h2>${p.n}</h2><p>${p.d}</p><p><b>Strengths:</b> ${p.s}</p><p><b>Possible challenges:</b> ${p.c}</p><p><b>Reflect:</b> ${p.q}</p><p><b>Try this:</b> ${p.t}</p><p class="note">Based on your answers today. It does not diagnose or predict anything.</p><button class="btn ghost" onclick="quiz={i:0,a:[]};qz()">Retake</button>`+conv('mind','Your mindset influences how you navigate life.','Explore practical ways to develop greater awareness, strengthen your perspective, and work toward meaningful personal goals.','Book a personal development consultation','mind','Explore personal growth resources','store')}
function qty(k,v){v=Math.max(1,parseInt(v)||1);cart[k]=v;route()}
function book(){if(!bk.day||!bk.time){$('#bke').textContent='Choose a day and a time first.';return}bk.done=true;route()}
function route(){const r=location.hash.slice(1)||'home';let h;
 if(r.startsWith('product-')&&BOOKS[r.slice(8)])h=product(r.slice(8));else h=(P[r]||P.home)();
 app.innerHTML=h;navUpdate();if(r==='fitness')bmiU();if(r==='growth')qz();if(r==='success')loadOrder()}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();
