<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Impavid | Financial Wellness, Fitness & Personal Development</title>
<meta name="description" content="Explore books, consultations and practical tools for financial wellness, health and fitness, and personal development at The Impavid.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#0d1b2e;--mut:#55627a;--line:#d9dfea;--fin:#1f4fd8;--fit:#d9480f;--mind:#0b7a6b;--gold:#f2a900;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--card:#121d31;--ink:#eef2f9;--mut:#a3afc4;--line:#25324a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Sora,system-ui,sans-serif}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.02em}h1{font-size:clamp(2rem,5.5vw,3.6rem);font-weight:800}h2{font-size:clamp(1.5rem,3vw,2.1rem)}h3{font-size:1.15rem}
p{margin:0 0 1em;max-width:68ch}a{color:inherit}
.wrap{max-width:1080px;margin:auto;padding:0 20px}

nav a{padding:8px 10px;border-radius:8px;text-decoration:none;font-size:.9rem}nav a:hover,nav a.on{background:var(--bg)}

@media(max-width:860px){.burger{display:block}nav{display:none;position:absolute;left:0;right:0;top:64px;background:var(--card);flex-direction:column;align-items:stretch;padding:10px 20px;border-bottom:1px solid var(--line)}nav.open{display:flex}}
.hero{background:linear-gradient(135deg,#0d1b2e,#16305c);color:#fff;padding:72px 0 80px}
.hero p{color:#c9d4e8;font-size:1.1rem}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 20px;font:600 .95rem Sora,sans-serif;cursor:pointer;text-decoration:none;background:var(--ink);color:var(--bg);margin:0 8px 8px 0}
.btn.gold{background:var(--gold);color:#1a1200}.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}.btn[disabled]{opacity:.5;cursor:not-allowed}

section{padding:56px 0}.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;position:relative}
.card.link{text-decoration:none;display:block;transition:transform .2s,box-shadow .2s}.card.link:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(13,27,46,.15)}

.bar{height:5px;border-radius:5px;background:var(--c);margin-bottom:16px;width:48px}
.fin{--c:var(--fin)}.fit{--c:var(--fit)}.mind{--c:var(--mind)}
.tool{border:2px solid var(--c);border-radius:18px;padding:26px;background:var(--card)}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.review-list{display:grid;gap:12px;margin:20px 0}.review-stars{color:#b07a00;font-size:1.2rem;letter-spacing:.08em}.review-item{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.review-form textarea{min-height:115px;resize:vertical}.review-form .trap{position:absolute;left:-9999px}.row{display:flex;gap:10px}.row>*{flex:1}

.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 18px}.prog i{display:block;height:100%;background:var(--mind);transition:width .3s}
.cover{aspect-ratio:2/3;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;font-weight:800;background:linear-gradient(160deg,var(--c),#0d1b2e);position:relative;max-width:190px}

img.cv{width:190px;max-width:100%;height:auto;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25)}.book{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.price{font-size:1.4rem;font-weight:800}
.store-grid{align-items:stretch}.store-card{display:flex;flex-direction:column;gap:10px}.store-card .store-cover{min-height:215px;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--bg);border-radius:12px}.store-card .store-cover .cv{max-height:215px;width:auto;object-fit:contain}.store-card .store-actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}.store-card .store-actions .btn{margin:0}.store-card .price{margin-top:4px}.store-rating{min-height:25px;font-size:.85rem;color:var(--mut)}.store-rating .review-stars{font-size:1.05rem}.store-rating a{color:inherit;text-underline-offset:3px}.store-card .store-desc{font-size:.88rem;color:var(--mut);margin:0}.store-card h3{margin:0}.store-card .tag{margin-top:2px}@media(max-width:600px){.store-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.store-card{padding:12px;gap:8px}.store-card .store-cover{min-height:145px;padding:6px}.store-card .store-cover .cv{max-height:145px}.store-card h3{font-size:.95rem}.store-card .store-desc{font-size:.77rem}.store-card .btn{padding:9px 10px;font-size:.78rem}.store-card .store-actions{display:grid}.store-card .store-rating{font-size:.76rem}.store-card .store-rating .review-stars{font-size:.9rem}}
table{width:100%;border-collapse:collapse}td,th{padding:12px 6px;border-bottom:1px solid var(--line);text-align:left}
.qty{width:60px}.slots{display:flex;flex-wrap:wrap;gap:8px}.slot{padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.slot.on{background:var(--ink);color:var(--bg)}
.ok{background:#e3f6ec;color:#0b4a2b;padding:16px;border-radius:12px;margin-top:14px}
footer{background:var(--card);border-top:1px solid var(--line);padding:30px 0;font-size:.85rem;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Contextual consultation action stays visible while reading each explanation */
.explain-card{position:relative}.explain-cta{position:sticky;bottom:14px;z-index:5;display:flex;justify-content:flex-end;pointer-events:none;margin-top:18px}.explain-cta .btn{pointer-events:auto;margin:0;background:var(--c);color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.24);border-radius:999px;padding:13px 20px}.explain-cta .btn:hover{filter:brightness(1.1)}@media(max-width:600px){.explain-cta{justify-content:center;bottom:12px}.explain-cta .btn{font-size:.86rem;padding:12px 17px}}

/* Homepage editorial showcase: isolated from payments, downloads and other routes */
.imp-hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 78% 45%,#273b56 0%,#101c2e 50%,#0b1320 100%);color:#fff;padding:72px 0 65px}
.imp-hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;min-height:370px}
.imp-eyebrow{color:#e7b969;text-transform:uppercase;font-size:.72rem;font-weight:800;letter-spacing:.2em;margin-bottom:20px}
.imp-hero h1{font-size:clamp(2.7rem,5vw,4.5rem);letter-spacing:-.055em;line-height:1.08}
.imp-hero p{color:#c4cfdf;max-width:520px}
.imp-showcase{position:relative;height:365px;isolation:isolate}
.imp-showcase:before{content:"";position:absolute;inset:16% 3%;border:1px solid rgba(238,189,103,.18);border-radius:50%;transform:rotate(-14deg)}
.imp-book{position:absolute;display:block;filter:drop-shadow(12px 20px 16px rgba(0,0,0,.45));transition:filter .3s;animation:impFloat 6s ease-in-out infinite;transform-origin:center bottom}
.imp-book img{display:block;width:100%;height:100%;object-fit:contain;border-radius:4px;transform:perspective(700px) rotateY(-10deg)}
.imp-book:hover{filter:drop-shadow(12px 25px 22px rgba(0,0,0,.65));animation-play-state:paused}
.imp-book.a{width:38%;height:80%;left:2%;top:11%;transform:rotate(-11deg);animation-delay:-1s;z-index:1}
.imp-book.b{width:40%;height:90%;left:31%;top:3%;transform:rotate(2deg);animation-delay:-3s;z-index:3}
.imp-book.c{width:38%;height:80%;right:0;top:11%;transform:rotate(10deg);animation-delay:-5s;z-index:2}
@keyframes impFloat{0%,100%{translate:0 0}50%{translate:0 -13px}}
.imp-section-intro{text-align:center;margin-bottom:26px}.imp-section-intro p{margin:0 auto;color:var(--mut)}
.imp-paths{display:grid;gap:18px}.imp-paths .imp-path:nth-child(2){background:linear-gradient(125deg,var(--card),rgba(217,72,15,.07))}.imp-paths .imp-path:nth-child(3){background:linear-gradient(125deg,var(--card),rgba(11,122,107,.07))}
.imp-path{--accent:var(--fin);display:grid;grid-template-columns:1fr 210px;gap:28px;align-items:center;position:relative;overflow:hidden;min-height:270px;padding:32px 42px;border-radius:20px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent)}
.imp-path.fit{--accent:var(--fit)}.imp-path.mind{--accent:var(--mind)}
.imp-path:after{content:"";position:absolute;right:-85px;top:-120px;width:350px;height:350px;border:1px solid var(--accent);border-radius:50%;opacity:.18;pointer-events:none}
.imp-path-copy{position:relative;z-index:1}.imp-path .imp-kicker{color:var(--accent);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.imp-path h3{font-size:clamp(1.55rem,3vw,2.15rem);margin:9px 0}.imp-path p{color:var(--mut);max-width:55ch}
.imp-actions{display:flex;flex-wrap:wrap;gap:10px}.imp-actions .btn{margin:0}.imp-actions .imp-outline{background:transparent;color:var(--ink);border:1px solid var(--line)}
.imp-path-art{display:block;position:relative;z-index:1;justify-self:center;width:170px;animation:impFloat 6s ease-in-out infinite}
.imp-path-art img{width:100%;height:auto;max-height:230px;object-fit:contain;border-radius:5px;filter:drop-shadow(10px 16px 12px rgba(0,0,0,.28));transform:rotate(5deg)}
.imp-path.fit .imp-path-art{animation-delay:-2s}.imp-path.mind .imp-path-art{animation-delay:-4s}
@media(max-width:700px){.imp-hero{padding:48px 0 32px}.imp-hero-grid{grid-template-columns:1fr;gap:12px}.imp-showcase{height:270px;max-width:410px;width:100%;margin:auto}.imp-path{grid-template-columns:minmax(0,1fr) 95px;padding:22px 16px;gap:10px;min-height:0}.imp-path-art{width:90px}.imp-path h3{font-size:1.35rem}.imp-path p{font-size:.9rem}.imp-actions .btn{font-size:.79rem;padding:9px 11px}}
@media(prefers-reduced-motion:reduce){.imp-book,.imp-path-art{animation:none!important}}

/* Dark Cinematic homepage theme: scoped to home only, not checkout or other pages */
body:has(.imp-hero){--bg:#0b111b;--card:#172131;--ink:#f3f5fa;--mut:#bac6d6;--line:#334154;background:#0b111b;color:#f3f5fa}

</style></head><body>
<header><div class="wrap nav"><a class="logo" href="#home"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M13 3a10 10 0 0 1 8.7 5"/><path d="M22 18a10 10 0 0 1-9 5"/><path d="M4 18a10 10 0 0 1 0-9"/><path d="M19 4l3 4-5 1M18 22l-4 1 1-5M4 9l3-4 1 5" stroke-width="1.6"/></svg>THE IMPAVID</a>
<button class="burger" aria-label="Menu" aria-expanded="false" onclick="toggleNav()">Menu</button>

<script>
const $=s=>document.querySelector(s),app=$('#app');
const BOOKS={
 rg:{t:'Relationship Goals',sub:'A Modern Guide To Getting More Out Of Your Bank',cat:'Financial Wellness',c:'fin',fmt:'EPUB e-book (instant download)',price:4.99,img:'assets/relationship-goals.jpg',d:'A modern guide to understanding banking relationships and financial opportunities. Also available on Kindle at $8.99 (free with Kindle Unlimited).'},
 wws:{t:'Watch Where You’re Standing',sub:'The Three Circles Method',cat:'Personal Development',c:'mind',fmt:'EPUB e-book (instant download)',price:4.99,img:'assets/watch-where-youre-standing.jpg',d:'A personal development book on emotional awareness, perspective and the Three Circles Method.'},
 mom:{t:'Mind Over Mirror',sub:'Become More Than What You See',cat:'Health & Fitness',c:'fit',fmt:'EPUB e-book (instant download)',price:4.99,img:'assets/mind-over-mirror-cover.jpg',d:'A personal journey through physical transformation, discipline, nutrition, and the spiritual growth that happens when you keep showing up for yourself. '}};
const SVC={fin:{n:'Financial Wellness Consultation',c:'fin'},mind:{n:'Personal Development Consultation',c:'mind'},fit:{n:'Fitness & Wellness Consultation',c:'fit'}};
let cart={},bk={svc:'fin',pkg:null,name:'',email:'',phone:'',err:'',busy:false},quiz={i:0,a:[]};
const money=n=>'$'+n.toFixed(2),cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function cover(k){const b=BOOKS[k];if(b.img)return `<img class="cv" src="${b.img}" alt="Cover of ${b.t}" width="190" loading="lazy">`;return `<div class="cover ${b.c}" role="img" aria-label="Placeholder cover for ${b.t}">${b.t}<small>${b.sub.split(':')[0]}</small></div>`}
function bookCard(k){const b=BOOKS[k];return `<div class="card ${b.c} book">${cover(k)}<div style="flex:1;min-width:200px"><span class="tag">Featured book · ${b.cat}</span><h3>${b.t}</h3><p>${b.d}</p><div class="price">${b.price?money(b.price):'Coming soon'}</div><p class="note">${b.fmt}</p>${buy(k)}<a class="btn ghost" href="#product-${k}">Learn more</a></div></div>`}
const buy=k=>BOOKS[k].soon?'<button class="btn" disabled>Coming soon</button>':`<button class="btn" onclick="add('${k}')">Add to cart</button>`;
function add(k){if(BOOKS[k].soon)return;if(cart[k])return toast('Already in your cart');cart[k]=1;navUpdate();toast(BOOKS[k].t+' added to cart')}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0d1b2e;color:#fff;padding:10px 18px;border-radius:10px;z-index:50;font-size:.9rem';document.body.append(t)}t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',1800)}
function toggleNav(){const n=$('#nav'),o=n.classList.toggle('open');$('.burger').setAttribute('aria-expanded',o)}
function navUpdate(){const r=location.hash.slice(1)||'home',L=[['home','Home'],['financial','Financial Wellness'],['fitness','Health & Fitness'],['growth','Personal Development'],['store','Bookstore'],['about','About']];
 $('#nav').innerHTML=L.map(([h,t])=>`<a href="#${h}" class="${r===h?'on':''}">${t}</a>`).join('')+`<a class="cta" href="#booking">Book a Consultation</a><a class="cartb" href="#cart" aria-label="Cart, ${cnt()} items">🛒<b>${cnt()}</b></a>`;$('#nav').classList.remove('open')}
function next(items){return `<section><div class="wrap"><h2>Continue your journey</h2><div class="grid">${items.map(([h,t,d,c])=>`<a class="card link ${c}" href="#${h}"><div class="bar"></div><h3>${t}</h3><p class="note">${d}</p></a>`).join('')}</div></div></section>`}
const ALL=[['financial','Financial Wellness','Credit score tool and banking education.','fin'],['fitness','Health & Fitness','BMI calculator and fitness services.','fit'],['growth','Personal Development','Mindset quiz and the Three Circles Method.','mind'],['store','Bookstore','Books from The Impavid.','fin']];
function toolCard(id,c,t,d,h){return `<div class="card ${c}"><div class="bar"></div><h3>${t}</h3><p>${d}</p><a class="btn" href="#${h}">Try it free</a></div>`}
function conv(c,h,p,b1,svc,b2,l2){return `<div class="conv ${c}"><h3>${h}</h3><p>${p}</p><a class="btn gold" href="#booking" onclick="bk.svc='${svc}'">${b1}</a><a class="btn ghost" href="#${l2}">${b2}</a></div>`}
function hero(c,t,p){return `<div class="hero ${c}" style="background:linear-gradient(135deg,#0d1b2e,var(--c))"><div class="wrap"><h1>${t}</h1><p>${p}</p></div></div>`}

financial:()=>hero('fin','Financial Wellness','Understand your credit, strengthen your banking relationships, and make informed financial decisions.')+`<section><div class="wrap"><div class="card fin explain-card" style="margin-bottom:20px"><div class="bar"></div><h2>Why does your credit matter?</h2><p>Your credit history tells lenders how you have managed borrowed money. Your credit score is one way they estimate the risk of lending to you. A stronger credit profile may help you qualify for financial products and more favorable terms; a weaker profile may mean higher borrowing costs, fewer choices, or an application being declined.</p><div class="grid"><div><h3>Borrowing power</h3><p class="note">Credit can influence eligibility for credit cards, car loans and mortgages. Income, debt and lender requirements matter too.</p></div><div><h3>What you pay</h3><p class="note">Interest rates and loan terms can make the same purchase cost much more over time. A higher score may help, but does not guarantee the lowest rate.</p></div><div><h3>Everyday opportunities</h3><p class="note">Some landlords review credit reports when screening rental applications. Credit can also affect certain other applications, subject to applicable rules.</p></div></div><h3>What helps build a healthier credit profile?</h3><p class="note">Pay on time, keep revolving balances manageable, review your credit reports for errors, and avoid applying for unnecessary accounts. Progress takes consistency; no score guarantees approval.</p><div class="explain-cta"><a class="btn" href="#booking" onclick="bk.svc='fin';bk.pkg=null" aria-label="Book a Financial Wellness consultation">Book a Consultation</a></div></div><div class="tool fin"><h2>What can your credit score do for you?</h2><p class="note">Not a credit check. Enter a score you already know. We never ask for your SSN, reports or account logins.</p><label for="cs">Your credit score (300–850)</label><input id="cs" type="number" inputmode="numeric" min="300" max="850"><div class="err" id="cse" role="alert"></div><button class="btn" onclick="credit()">See my opportunities</button><div id="cso"></div></div>${bookCard('rg')}</div></section>`,
fitness:()=>hero('fit','Health & Fitness','Fitness education, nutrition, training and transformation programs.')+`<section><div class="wrap"><div class="card fit explain-card" style="margin-bottom:20px"><div class="bar"></div><h2>What is BMI, and why does it matter?</h2><p><strong>Body Mass Index (BMI)</strong> is a number calculated from your height and weight. For adults, it is a screening tool that can flag weight ranges associated with possible health risks. It is not a diagnosis and cannot tell how much of your weight comes from muscle versus fat.</p><div class="grid"><div><h3>Below 18.5</h3><p class="note">Underweight range. In some people this may be associated with inadequate nutrition or other health concerns; the cause matters.</p></div><div><h3>18.5–24.9</h3><p class="note">Healthy-weight range for most adults. It does not guarantee good health.</p></div><div><h3>25.0–29.9</h3><p class="note">Overweight range. This can be associated with increased risk of certain conditions, but BMI alone cannot determine an individual's risk.</p></div><div><h3>30.0 and above</h3><p class="note">Obesity range. Higher BMI is associated with increased population-level risk of conditions such as type 2 diabetes and cardiovascular disease.</p></div></div><p class="note">Muscular builds, age and individual differences can change how useful BMI is. Waist measurement, blood pressure, lab results, fitness and medical history provide additional context. Adult BMI categories are not appropriate for children or teens.</p><div class="explain-cta"><a class="btn" href="#booking" onclick="bk.svc='fit';bk.pkg=null" aria-label="Book a Health and Fitness consultation">Book a Consultation</a></div></div><div class="tool fit"><h2>Try our free BMI calculator</h2><p class="note">For adults 18+. BMI is a screening measure; it does not directly measure body fat, muscle or overall health.</p><label for="u">Units</label><select id="u" onchange="bmiU()"><option value="i">Feet/inches &amp; pounds</option><option value="m">Centimeters &amp; kilograms</option></select><div class="row" id="hrow"></div><label for="w" id="wl">Weight (lb)</label><input id="w" type="number" inputmode="decimal" min="0"><div class="err" id="be" role="alert"></div><button class="btn" onclick="bmi()">Calculate</button><div id="bo"></div></div>${bookCard('mom')}</div></section>`,
growth:()=>hero('mind','Personal Development','Build self-awareness, strengthen your mindset, and learn how to respond to life with intention.')+`<section><div class="wrap"><div class="card mind explain-card" style="margin-bottom:20px"><div class="bar"></div><h2>Why does personal development matter?</h2><p>How you think, respond to challenges, and speak to yourself can shape the decisions you make every day. Personal development is the practice of understanding your patterns and building habits that support the life you want. It is not about being positive every minute or pretending difficult emotions do not exist.</p><div class="grid"><div><h3>Know your patterns</h3><p class="note">Notice what triggers stress, self-doubt or avoidance. Awareness gives you a chance to respond instead of running on autopilot.</p></div><div><h3>Build trust in yourself</h3><p class="note">Small promises kept consistently can strengthen confidence, discipline and the belief that you can follow through.</p></div><div><h3>Handle emotions with intention</h3><p class="note">Feelings are real experiences, but they do not always tell the whole story. You can acknowledge what hurts without letting it dictate every next move.</p></div><div><h3>Turn reflection into action</h3><p class="note">Name a goal, identify what stands in the way, and choose one realistic step you can take today.</p></div></div><h3>Where are you standing right now?</h3><p>The Impavid's Three Circles Method invites you to notice where your attention is spending the most time. Happiness, anxiety, sadness and other feelings can coexist. The goal is not to erase an emotion, but to recognize what you are feeding and decide where to place your attention next.</p><p class="note">The short mindset reflection below helps you explore tendencies, not diagnose a mental health condition or label you as a positive or negative person. There are no perfect answers.</p><div class="explain-cta"><a class="btn" href="#booking" onclick="bk.svc='mind';bk.pkg=null" aria-label="Book a Personal Development consultation">Book a Consultation</a></div></div><div class="tool mind" id="qz"></div><div class="card mind" style="margin:20px 0"><h3>The Three Circles Method</h3><p>People feel several emotions at once. Inspired by <i>Watch Where You’re Standing</i>, the idea is to notice where your attention goes, recognize your emotional patterns, and choose how to respond. It builds self-awareness; it does not diagnose anything.</p></div>${bookCard('wws')}</div></section>`,

cart:()=>{const ks=Object.keys(cart);let tot=ks.reduce((a,k)=>a+(BOOKS[k].price||0)*cart[k],0);
 return hero('fin','Your cart','Review your order.')+`<section><div class="wrap">${ks.length?`<table><tr><th>Item</th><th>Price</th><th></th></tr>${ks.map(k=>`<tr><td>${BOOKS[k].t}<br><span class="note">${BOOKS[k].fmt}</span></td><td>${BOOKS[k].price?money(BOOKS[k].price):'TBD'}</td><td><button class="slot" onclick="delete cart['${k}'];route()">Remove</button></td></tr>`).join('')}</table><p class="price" style="margin-top:16px">Subtotal: ${money(tot)}</p><label for="ebook-email"><b>Email for your ebook receipt and re-download link</b></label><input id="ebook-email" type="email" autocomplete="email" required placeholder="you@example.com" style="display:block;width:100%;max-width:380px;margin:8px 0 14px;padding:12px"><button class="btn" onclick="payBooks()">Checkout with Square</button><div class="err" id="ce" role="alert"></div><p class="note">Secure checkout powered by Square. After confirmed payment, your EPUB download appears on the confirmation page.</p>`:`<p>Your cart is empty. <a href="#store">Browse the bookstore</a>.</p>`}</div></section>`}
};
function product(k){const b=BOOKS[k];return hero(b.c,b.t,b.sub)+`<section><div class="wrap"><div class="book">${cover(k)}<div style="flex:1;min-width:220px" class="${b.c}"><span class="tag">${b.cat}</span><p>${b.d}</p><p class="note">Format: ${b.fmt}</p><div class="price">${b.price?money(b.price):'Coming soon'}</div>${buy(k)}</div></div><div class="card review-form" style="margin-top:30px"><h2>Reader reviews</h2><p class="note">Real reader feedback. Reviews are checked before publication.</p><div id="reviews-${k}" class="review-list" aria-live="polite">Loading reviews…</div><h3>Write a review</h3><form onsubmit="submitReview(event,'${k}')"><label for="review-name">Your name</label><input id="review-name" name="name" maxlength="60" minlength="2" required autocomplete="name"><label for="review-rating">Your rating</label><select id="review-rating" name="rating" required><option value="">Choose stars</option>${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)} (${n}/5)</option>`).join('')}</select><label for="review-text">Your review</label><textarea id="review-text" name="text" minlength="15" maxlength="1200" required placeholder="What did you think of this book?"></textarea><div class="trap" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><p class="note">Reviews are moderated before publication. Please don't include private information.</p><button class="btn" type="submit">Submit review</button><div id="review-message" class="note" role="status"></div></form></div></div></section>`+next(Object.keys(BOOKS).filter(x=>x!==k).map(x=>['product-'+x,BOOKS[x].t,BOOKS[x].cat,BOOKS[x].c]))}

async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong. Please try again.');return j}
async function payConsult(){const e=m=>{bk.err=m;route()};if(!bk.pkg)return e('Choose a package.');if(bk.name.trim().length<2)return e('Enter your full name.');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(bk.email.trim()))return e('Enter a valid email address.');if(!/^[0-9+()\-.\s]{7,25}$/.test(bk.phone.trim()))return e('Enter a valid phone number.');bk.err='';bk.busy=true;route();
 try{const j=await post('/api/checkout-consultation',{category:CATS[bk.svc][0],package:bk.pkg,name:bk.name.trim(),email:bk.email.trim(),phone:bk.phone.trim()});location.href=j.url}catch(x){bk.busy=false;e(x.message)}}
async function payBooks(){const el=$('#ce'),email=($('#ebook-email')?.value||'').trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){el.textContent='Enter your email to receive your ebook access link.';return}try{const j=await post('/api/checkout-books',{items:Object.keys(cart),email});location.href=j.url}catch(x){el.textContent=x.message}}
async function loadOrder(){
 const el=$('#ok'),sid=new URLSearchParams(location.search).get('square_ref');
 if(!el)return;
 if(!sid){el.textContent='No Square checkout reference found. Please return using your Square payment confirmation link.';return}
 try{
  const response=await fetch('/api/order?square_ref='+encodeURIComponent(sid),{cache:'no-store'});
  const j=await response.json();
  if(!response.ok||!j.paid){
   const msg=typeof j.error==='string'?j.error:'Order verification is temporarily unavailable.';
   el.textContent=msg+' If you have already paid, do not pay again. Contact support@theimpavid.com with your receipt.';
   return;
  }
  if(j.kind==='consultation'){
   el.innerHTML=`<h2>Payment received</h2><p>Thank you for booking with The Impavid! Your payment has been received. We will contact you within 24–48 hours to personally arrange your consultation.</p><p class="note">${esc(j.category)} · ${esc(j.package)}</p>`;
  }else if(j.kind==='books'&&Array.isArray(j.downloads)){
   el.innerHTML='<h2>Your purchased ebooks</h2><p>Your payment is confirmed. Save this page until your books are in your reading app.</p>'+j.downloads.map(d=>`<p><a class="btn" href="${esc(d.url)}" download>Download ${esc(d.title)} (.epub)</a></p>`).join('')+'<h3>Reading on your phone</h3><p><b>iPhone or iPad:</b> Tap Download. Open the Files app, find the EPUB in Downloads (check On My iPhone/iPad and iCloud Drive), tap it, and use Share → Books if needed. Confirm the book appears in Apple Books before closing this page.</p><p><b>Android:</b> Tap Download. Open Files / My Files → Downloads, then open the EPUB with a compatible reader such as Google Play Books.</p><p class="note">Your purchase confirmation and re-download link will be emailed to the address you entered at checkout. If you do not see it, check spam. Download buttons expire after 15 minutes; reload this page for fresh buttons. You never need to buy the same book again.</p>';
  }else{
   el.textContent='Payment confirmed, but the order details were incomplete. Contact support@theimpavid.com.';
  }
 }catch(error){
  console.error('Order confirmation request failed:',error);
  el.textContent='Could not reach the order verification service. If you already paid, do not pay again. Please reload or contact support@theimpavid.com.';
 }
}

function credit(){const v=$('#cs').value,n=+v,e=$('#cse');if(!v||!Number.isInteger(n)||n<300||n>850){e.textContent='Enter a whole number from 300 to 850.';$('#cso').innerHTML='';return}e.textContent='';
 const R=[[579,'Poor','Approval is difficult and costs are typically higher.','Secured cards, credit-builder loans; some subprime auto loans.','Limited options; higher interest likely.','Pay on time, lower balances, dispute errors, avoid new applications.'],[669,'Fair','Some options exist, usually at higher cost.','Credit cards, auto loans, some personal loans; FHA-type mortgages.','Higher rates than top tiers.','Cut utilization below 30%, keep accounts current.'],[739,'Good','Near or above average; many options.','Most cards, auto, personal and mortgage loans.','Best offers may still be out of reach.','Keep utilization low and history long.'],[799,'Very Good','Lenders generally view this favorably.','Wide range including competitive mortgage and business financing.','Little; minor rate differences.','Maintain habits; compare offers.'],[850,'Exceptional','Top tier among borrowers.','Broadest access, often the most favorable terms.','Score alone does not guarantee approval.','Maintain habits and review reports yearly.']];
 const r=R.find(x=>n<=x[0]);const plans=[
 ['Check your credit reports for inaccurate information at AnnualCreditReport.com.','Set up reminders or autopay so upcoming payments are on time.','If you use credit cards, focus on bringing down balances without taking on new debt.'],
 ['Review your reports and identify any missed payments or high balances.','Make a realistic plan to pay every bill on time.','Work on reducing revolving balances; compare total borrowing costs before applying.'],
 ['Keep payment history strong and review your reports regularly.','Maintain manageable balances rather than chasing a single score threshold.','Compare rates and fees from multiple lenders before accepting an offer.'],
 ['Protect your on-time payment history and avoid unnecessary applications.','Check reports for inaccuracies and monitor account activity.','Shop competing offers based on APR, fees and terms—not the score alone.'],

 ];const steps=plans[R.indexOf(r)];$('#cso').innerHTML=`<div class="res"><div class="big">${n} · ${r[1]}</div><p>${r[2]}</p><p><b>Financing that may be accessible:</b> ${r[3]}</p><p><b>Potential challenges:</b> ${r[4]}</p><p><b>Opportunities:</b> ${r[5]}</p><h3>Your next three moves</h3><ol><li>${steps[0]}</li><li>${steps[1]}</li><li>${steps[2]}</li></ol><p class="note">This is general educational guidance based only on the score you entered—not a review of your credit report.</p><p class="note">Approval and rates depend on income, debt, credit history, lender rules and the scoring model. Nothing here guarantees approval or a rate.</p></div>`+conv('fin','Your credit score is only part of your financial profile.','Discover how to strengthen your financial position and make more informed financial decisions.','Book a credit consultation','fin','Explore financial resources','store')}
function bmiU(){const m=$('#u').value==='m';$('#hrow').innerHTML=m?'<div><label for="h1">Height (cm)</label><input id="h1" type="number" min="0"></div>':'<div><label for="h1">Feet</label><input id="h1" type="number" min="0"></div><div><label for="h2">Inches</label><input id="h2" type="number" min="0"></div>';$('#wl').textContent=m?'Weight (kg)':'Weight (lb)'}
function bmi(){const m=$('#u').value==='m',w=+$('#w').value,h1=+$('#h1').value,h2=+($('#h2')?.value||0),e=$('#be');
 const hm=m?h1/100:(h1*12+h2)*.0254,kg=m?w:w*.45359237;
 if(!(hm>.9&&hm<2.5)||!(kg>20&&kg<400)){e.textContent='Enter a realistic adult height and weight.';$('#bo').innerHTML='';return}e.textContent='';
 const b=kg/hm/hm,c=b<18.5?'Underweight':b<25?'Healthy weight':b<30?'Overweight':'Obesity',lo=18.5*hm*hm,hi=24.9*hm*hm,f=x=>m?x.toFixed(1)+' kg':Math.round(x/.45359237)+' lb';
 const advice=b<18.5?['Consider discussing an unexpectedly low weight or unintentional weight loss with a healthcare professional.','Aim for regular, nourishing meals that meet your needs.','Include enjoyable strength and movement activities as appropriate.']:b<25?['Keep building a routine of movement you can maintain.','Prioritize balanced meals, sleep and recovery.','Track how you feel and other health measures, not just weight.']:['Consider discussing your overall health risks with a healthcare professional, especially if you have other concerns.','Choose a sustainable movement routine suited to your abilities.','Start with one manageable nutrition or sleep habit rather than a crash diet.'];
 $('#bo').innerHTML=`<div class="res"><div class="big">${b.toFixed(1)}</div><p><b>${c}</b> (adult reference categories)</p><p>BMI compares weight to height. Reference range for your height: ${f(lo)} to ${f(hi)}. It does not measure body fat, muscle or overall health.</p><h3>Three practical next steps</h3><ol><li>${advice[0]}</li><li>${advice[1]}</li><li>${advice[2]}</li></ol><p class="note">BMI is one screening measure, not an individual diagnosis or a required target weight. A clinician can interpret it alongside your health history and other measures.</p></div><div class="conv fit"><h3>Understanding where you are is the first step toward where you want to be.</h3><p>Personal training, fitness consultations, body-transformation coaching, nutrition education and programs.</p><a class="btn gold" href="#booking" onclick="bk.svc='fit'">Book a fitness consultation</a><a class="btn ghost" href="#store">Explore fitness services</a></div>`}
const Q=[['When a challenge shows up, you…',['Run through every outcome first','Look for the bright side','Assess the facts','Start building a plan']],['After a setback, you…',['Replay what went wrong','Believe it will turn around','Accept it and adjust','Fix the cause right away']],['Your general outlook is…',['Cautious','Hopeful','Balanced','Action-oriented']],['Facing a problem, you…',['Gather more info before moving','Trust it will work out','Weigh pros and cons','Break it into steps']],['When emotions run high, you…',['Dwell on them','Stay upbeat','Name them calmly','Channel them into tasks']],['With uncertainty, you…',['Worry about what-ifs','Expect good things','Plan for likely cases','Create a process']],['For personal growth, you…',['Reflect deeply','Stay motivated','Set realistic goals','Track and improve']]];
const PR=[{n:'The Overthinker',d:'You think things through carefully and notice details others miss.',s:'Thoroughness, foresight, empathy.',c:'Getting stuck in loops or delaying decisions.',q:'Which thoughts are about facts, and which are guesses?',t:'Set a decision deadline; write worries down, then pick one next action.'},{n:'The Optimist',d:'You lean toward hope and energy.',s:'Resilience, motivation, positivity.',c:'Overlooking risks or avoiding hard feelings.',q:'What risk am I not looking at yet?',t:'Pair optimism with a simple backup plan.'},{n:'The Realist',d:'You weigh evidence and stay grounded.',s:'Balance, clarity, steadiness.',c:'Under-valuing possibility.',q:'What would be worth trying even without proof?',t:'Schedule one experiment a month.'},{n:'The Problem Solver',d:'You turn challenges into steps.',s:'Initiative, structure, momentum.',c:'Rushing past feelings.',q:'What am I feeling before I act?',t:'Pause to name the emotion, then solve.'}];
function qz(){const el=$('#qz');if(!el)return;
 if(quiz.i<Q.length){const[q,o]=Q[quiz.i];el.innerHTML=`<h2>What’s your mindset?</h2><p class="note">A reflection exercise, not a clinical assessment or permanent label.</p><div class="note">Question ${quiz.i+1} of ${Q.length}</div><div class="prog"><i style="width:${quiz.i/Q.length*100}%"></i></div><h3>${q}</h3>${o.map((x,i)=>`<button class="opt" onclick="quiz.a.push(${i});quiz.i++;qz()">${x}</button>`).join('')}`;return}
 const t=[0,0,0,0];quiz.a.forEach(i=>t[i]++);const k=t.indexOf(Math.max(...t)),p=PR[k];
 const nextSteps=[['Write down one recurring worry and separate facts from assumptions.','Give yourself a short decision deadline for a low-stakes choice.','Take one small action instead of revisiting every possible outcome.'],['Name one uncomfortable feeling without trying to replace it immediately.','Identify one realistic obstacle to a goal.','Write a backup plan while keeping your hopeful outlook.'],['Choose a meaningful goal you have been postponing.','Try one small experiment even if the outcome is uncertain.','Review what you learned rather than judging yourself by the result.'],['Pause and name your emotion before starting to fix the problem.','Ask whether the problem needs action, rest, or a conversation.','Choose one manageable next step and check in with yourself afterward.']][k];
 el.innerHTML=`<h2>${p.n}</h2><p>${p.d}</p><p><b>Strengths:</b> ${p.s}</p><p><b>Possible challenges:</b> ${p.c}</p><p><b>Reflect:</b> ${p.q}</p><p><b>Try this:</b> ${p.t}</p><h3>Your three next steps</h3><ol><li>${nextSteps[0]}</li><li>${nextSteps[1]}</li><li>${nextSteps[2]}</li></ol><p class="note">This is a reflection prompt based on the answers you selected, not a validated personality test.</p><p class="note">Based on your answers today. It does not diagnose or predict anything.</p><button class="btn ghost" onclick="quiz={i:0,a:[]};qz()">Retake</button>`+conv('mind','Your mindset influences how you navigate life.','Explore practical ways to develop greater awareness, strengthen your perspective, and work toward meaningful personal goals.','Book a personal development consultation','mind','Explore personal growth resources','store')}
function qty(k,v){v=Math.max(1,parseInt(v)||1);cart[k]=v;route()}
function book(){if(!bk.day||!bk.time){$('#bke').textContent='Choose a day and a time first.';return}bk.done=true;route()}
async function loadStoreRatings(){await Promise.all(Object.keys(BOOKS).map(async k=>{const el=document.getElementById('store-rating-'+k);if(!el)return;try{const response=await fetch('/api/reviews?book='+encodeURIComponent(k),{cache:'no-store'});const data=await response.json();if(!response.ok||!Array.isArray(data.reviews))throw Error('Ratings unavailable');if(!el.isConnected)return;const reviews=data.reviews.filter(r=>Number.isInteger(r.rating)&&r.rating>=1&&r.rating<=5);if(!reviews.length){el.textContent='No reader ratings yet';return}const average=reviews.reduce((sum,r)=>sum+r.rating,0)/reviews.length;el.innerHTML=`<a href="#product-${k}" aria-label="${average.toFixed(1)} out of 5 stars from ${reviews.length} published reviews"><span class="review-stars" aria-hidden="true">${'★'.repeat(Math.round(average))}${'☆'.repeat(5-Math.round(average))}</span> ${average.toFixed(1)}/5 · ${reviews.length} ${reviews.length===1?'review':'reviews'}</a>`}catch(e){if(el.isConnected)el.textContent='Reader ratings unavailable'}}))}
async function loadReviews(k){const el=document.getElementById('reviews-'+k);if(!el)return;try{const res=await fetch('/api/reviews?book='+encodeURIComponent(k));const data=await res.json();if(!res.ok)throw Error(data.error||'Unable to load reviews.');el.innerHTML=data.reviews.length?data.reviews.map(r=>`<article class="review-item"><div class="review-stars" aria-label="${r.rating} out of 5 stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><strong>${esc(r.name)}</strong> <span class="note">· ${new Date(r.createdAt).toLocaleDateString()}</span><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.text)}</p></article>`).join(''):'<p class="note">No published reviews yet. Be the first to share your thoughts.</p>'}catch(e){el.textContent=e.message}}
async function submitReview(event,k){event.preventDefault();const form=event.currentTarget,btn=form.querySelector('button[type=submit]'),msg=document.getElementById('review-message');btn.disabled=true;msg.textContent='Submitting…';try{const d=Object.fromEntries(new FormData(form));d.book=k;d.rating=Number(d.rating);const res=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await res.json();if(!res.ok)throw Error(j.error||'Submission failed.');msg.textContent='Thank you! Your review is awaiting approval.';form.reset()}catch(e){msg.textContent=e.message}finally{btn.disabled=false}}
function route(){const r=location.hash.slice(1)||'home';let h;
 if(r.startsWith('product-')&&BOOKS[r.slice(8)])h=product(r.slice(8));else h=(P[r]||P.home)();
 app.innerHTML=h;navUpdate();if(r==='store')loadStoreRatings();if(r.startsWith('product-')&&BOOKS[r.slice(8)])loadReviews(r.slice(8));if(r==='fitness')bmiU();if(r==='growth')qz();if(r==='success')loadOrder()}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();
